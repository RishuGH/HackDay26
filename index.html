<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HackDay 2026 | NIT Jamshedpur</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @import "tailwindcss";
      @custom-variant dark (&:where(.dark, .dark *));
    </style>
    <script>
      if (
        localStorage.getItem('theme') === 'dark' ||
        (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)
      ) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    </script>
  </head>
  <body class="min-h-screen bg-[#f7f7f2] px-5 py-12 text-[#10201d] transition-colors duration-300 sm:py-20 dark:bg-[#0c1412] dark:text-[#f0f4f3]">
    <!-- Dark Mode Toggle Button -->
    <div class="fixed top-5 right-5 z-50">
      <button
        id="theme-toggle"
        type="button"
        aria-label="Toggle dark mode"
        class="flex h-11 w-11 cursor-pointer items-center justify-center rounded-full border border-[#e4e5da] bg-white/90 text-[#10201d] shadow-lg backdrop-blur-sm transition-all duration-200 hover:scale-105 active:scale-95 focus:outline-none focus:ring-2 focus:ring-[#8bb2de] dark:border-[#2b3d39] dark:bg-[#182321]/90 dark:text-[#f0f4f3]"
      >
        <!-- Sun icon (shown in dark mode) -->
        <svg id="theme-toggle-light-icon" class="hidden h-5 w-5 fill-current" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path>
        </svg>
        <!-- Moon icon (shown in light mode) -->
        <svg id="theme-toggle-dark-icon" class="hidden h-5 w-5 fill-current" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
        </svg>
      </button>
    </div>

    <main class="mx-auto max-w-3xl">
      <header class="mb-10 text-center sm:mb-14">
        <p class="mb-4 inline-flex items-center gap-2 rounded-full bg-[#f5b726] px-4 py-2 text-sm font-bold tracking-wide text-[#10201d]">
          <span aria-hidden="true" class="h-2 w-2 rounded-full bg-[#e53927]"></span>
          OPEN SOURCE · BIG IDEAS
        </p>
        <h1 class="text-4xl font-black leading-tight tracking-tight sm:text-6xl dark:text-white">
          HackDay <span class="text-[#e53927]">2026</span>
        </h1>
        <p class="mt-2 text-xl font-semibold text-[#2e4742] sm:text-2xl dark:text-[#a0bcb6]">NIT Jamshedpur</p>
        <div class="mx-auto my-6 h-1 w-16 rounded-full bg-[#8bb2de]"></div>
        <p class="text-base font-medium text-[#52635f] sm:text-lg dark:text-[#8ea39e]">
          In collaboration with
          <span class="font-bold text-[#10201d] dark:text-[#f0f4f3]">Hacktoberfest 2026</span>
        </p>
      </header>

      <section class="overflow-hidden my-5 rounded-3xl border border-[#e4e5da] bg-white shadow-xl shadow-[#10201d]/10 transition-colors duration-300 dark:border-[#223530] dark:bg-[#15201d] dark:shadow-black/50">
        <div class="h-2 bg-gradient-to-r from-[#e53927] via-[#f5b726] to-[#8bb2de]"></div>
        <div class="p-7 sm:p-10">
          <div class="mb-8">
            <h2 class="mt-2 text-2xl font-extrabold sm:text-3xl dark:text-white">Team Information</h2>
          </div>
          <dl class="grid gap-4 sm:grid-cols-3">
            <div class="rounded-2xl bg-[#f7f7f2] p-5 transition-colors dark:bg-[#1d2b27]">
              <dt class="text-sm font-semibold text-[#52635f] dark:text-[#8ea39e]">Team Name</dt>
              <dd class="mt-2 text-lg font-bold dark:text-white">Quantum</dd>
            </div>
            <div class="rounded-2xl bg-[#d7e5f4] p-5 transition-colors dark:bg-[#1e2e3d]">
              <dt class="text-sm font-semibold text-[#1f4e6b] dark:text-[#93c5fd]">Team Leader</dt>
              <dd class="mt-2 text-lg font-bold text-[#10201d] dark:text-[#e0f2fe]">Aman Raj</dd>
            </div>
            <div class="rounded-2xl bg-[#fbe4a6] p-5 transition-colors dark:bg-[#2e2617]">
              <dt class="text-sm font-semibold text-[#8a5d13] dark:text-[#fcd34d]">Branch</dt>
              <dd class="mt-2 text-lg font-bold text-[#10201d] dark:text-[#fef3c7]">Electronics and Communication Engineering</dd>
            </div>
          </dl>
        </div>
      </section>      
    </main>

    <script>
      const themeToggleBtn = document.getElementById('theme-toggle');
      const lightIcon = document.getElementById('theme-toggle-light-icon');
      const darkIcon = document.getElementById('theme-toggle-dark-icon');

      function updateIcons() {
        const isDark = document.documentElement.classList.contains('dark');
        if (isDark) {
          lightIcon.classList.remove('hidden');
          darkIcon.classList.add('hidden');
        } else {
          lightIcon.classList.add('hidden');
          darkIcon.classList.remove('hidden');
        }
      }

      updateIcons();

      themeToggleBtn.addEventListener('click', () => {
        const isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        updateIcons();
      });
    </script>
  </body>
</html>
